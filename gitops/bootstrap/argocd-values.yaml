# argo-cd helm chart values — 最小化实验配置（单节点非 HA）
# 对应 app 版本：Argo CD v3.6.2

# 单副本控制平面
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  replicas: 1
  # 无 Ingress，UI 经 kubectl port-forward 访问
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# 本阶段不用 SSO / 通知 / ApplicationSet
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
