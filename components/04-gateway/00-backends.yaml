apiVersion: v1
kind: Namespace
metadata:
  name: gateway-lab
---
# backend-v1：3 副本，用于观察负载均衡轮询
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: gateway-lab
  labels: {app: backend-v1}
spec:
  replicas: 3
  selector:
    matchLabels: {app: backend-v1}
  template:
    metadata:
      labels: {app: backend-v1}
    spec:
      initContainers:
        - name: init-page
          image: busybox:1.36
          # 把 Pod 名写进首页，curl 即可识别打到哪个后端实例
          command: ["sh", "-c", "echo 'backend-v1 | pod: '$HOSTNAME > /usr/share/nginx/html/index.html"]
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
      volumes:
        - name: html
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: gateway-lab
spec:
  selector: {app: backend-v1}
  ports: [{name: http, port: 80, targetPort: 80}]
---
# backend-v2：权重切流目标
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: gateway-lab
  labels: {app: backend-v2}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend-v2}
  template:
    metadata:
      labels: {app: backend-v2}
    spec:
      initContainers:
        - name: init-page
          image: busybox:1.36
          command: ["sh", "-c", "echo 'backend-v2 | pod: '$HOSTNAME > /usr/share/nginx/html/index.html"]
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
      volumes:
        - name: html
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v2
  namespace: gateway-lab
spec:
  selector: {app: backend-v2}
  ports: [{name: http, port: 80, targetPort: 80}]
---
# slow-backend：接受连接但 30 秒不响应，验证 Gateway 超时
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-backend
  namespace: gateway-lab
  labels: {app: slow-backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: slow-backend}
  template:
    metadata:
      labels: {app: slow-backend}
    spec:
      containers:
        - name: slow
          image: busybox:1.36
          # nc 每次接受连接后挂起 30s 不返回任何数据
          command: ["sh", "-c", "while true; do nc -l -p 8080 -e sh -c 'sleep 30'; done"]
          resources:
            requests: {cpu: "10m", memory: "8Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: slow-backend
  namespace: gateway-lab
spec:
  selector: {app: slow-backend}
  ports: [{name: http, port: 8080, targetPort: 8080}]
